<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>هوميرا · تواصل معنا</title>
<meta name="description" content="هوميرا للتسويق العقاري — تواصل معنا مباشرة عبر واتساب."/>
<meta name="theme-color" content="#0E3340"/>
<meta property="og:type" content="website"/>
<meta property="og:title" content="هوميرا · تواصل معنا"/>
<meta property="og:description" content="تواصل معنا مباشرة عبر واتساب."/>
<meta property="og:image" content="/uploads/1-logo.png"/>
<link rel="icon" type="image/png" href="/uploads/1-logo.png"/>
<link rel="apple-touch-icon" href="/uploads/1-logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;800&display=swap" rel="stylesheet"/>
<script src="/homera-api.js?v=3"></script>
<script src="/homera-tweaks.js?v=4"></script>
<style>
:root{
  --petrol-d:#0E3340;
  --petrol:#15495B;
  --gold:#C7A36B;
  --gold-l:#E0C99B;
  --wa:#25D366;
  --wa-d:#128C7E;
  --font:'Alexandria',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:var(--font);
  background:var(--petrol-d);
  color:#EAF1F0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;   /* زر واحد فقط — نتوسّط عمودياً */
  padding:48px 18px 32px;
  position:relative;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
/* توهّجات خلفية ناعمة بلون العلامة */
body::before,body::after{
  content:'';position:fixed;border-radius:50%;pointer-events:none;z-index:0;
  filter:blur(90px);opacity:.5;
}
body::before{width:460px;height:460px;top:-160px;inset-inline-start:-140px;background:rgba(199,163,107,.30);}
body::after{width:520px;height:520px;bottom:-220px;inset-inline-end:-160px;background:rgba(28,92,112,.55);}

.stack{width:100%;max-width:460px;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;}

/* ===== الهوية ===== */
.avatar{
  width:118px;height:118px;border-radius:50%;
  background:#fff;
  display:grid;place-items:center;
  padding:11px;
  box-shadow:0 0 0 3px rgba(199,163,107,.85), 0 18px 40px rgba(0,0,0,.38);
  overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:contain;display:block;}
h1{font-size:28px;font-weight:800;margin-top:20px;letter-spacing:.2px;}
.handle{margin-top:7px;font-size:14px;color:var(--gold-l);font-weight:600;direction:ltr;}
.bio{margin-top:14px;font-size:15.5px;line-height:1.9;color:#CBD9DA;text-align:center;max-width:400px;}

/* ===== زر الواتساب (الرابط الوحيد) ===== */
.wa-btn{
  display:flex;align-items:center;gap:14px;
  width:100%;margin-top:34px;padding:19px 20px;
  border-radius:16px;
  background:linear-gradient(135deg,var(--wa) 0%,var(--wa-d) 100%);
  border:1px solid rgba(255,255,255,.22);
  color:#fff;text-decoration:none;
  font-size:17.5px;font-weight:800;
  box-shadow:0 14px 34px rgba(37,211,102,.28);
  transition:transform .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease;
}
.wa-btn .ico{
  flex:none;width:42px;height:42px;border-radius:12px;
  display:grid;place-items:center;
  background:rgba(255,255,255,.20);
}
.wa-btn .ico svg{width:25px;height:25px;}
.wa-btn .txt{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0;}
.wa-btn .txt small{font-size:12.5px;font-weight:400;color:rgba(255,255,255,.85);text-align:right;}
.wa-btn .arw{flex:none;opacity:.7;transition:transform .18s ease,opacity .18s ease;}
.wa-btn:hover{
  transform:translateY(-2px);
  background:linear-gradient(135deg,#2ee06f 0%,#149c8b 100%);
  border-color:rgba(255,255,255,.4);
  box-shadow:0 18px 40px rgba(37,211,102,.4);
}
.wa-btn:hover .arw{opacity:1;transform:translateX(-4px);}
.wa-btn:active{transform:translateY(0);}

.foot{margin-top:34px;text-align:center;font-size:12.5px;color:#8FA3A6;line-height:2;}

@media (max-width:400px){
  .avatar{width:100px;height:100px;}
  h1{font-size:24px;}
  .bio{font-size:14.5px;}
  .wa-btn{font-size:16px;padding:17px 15px;gap:11px;}
}
@media (prefers-reduced-motion:reduce){
  .wa-btn,.wa-btn .arw{transition:none;}
  .wa-btn:hover{transform:none;}
}
</style>
</head>
<body>

<main class="stack">

  <!-- الشعار: يُستبدل تلقائياً بشعار لوحة التحكم إن رُفع واحد -->
  <div class="avatar brandmark">
    <img class="brand-logo" src="/uploads/1-logo.png" alt="هوميرا"/>
  </div>

  <h1>هوميرا</h1>
  <div class="handle">@homera.sa</div>
  <p class="bio" data-tw="heroTitle">حياة عنوانها الرقي والراحة</p>

  <a class="wa-btn" data-wa href="https://wa.me/966530425505" target="_blank" rel="noopener">
    <span class="ico">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.5 14.4c-.3-.2-1.8-.9-2-1s-.5-.2-.7.1-.8 1-1 1.2-.4.2-.7.1a8.2 8.2 0 0 1-2.4-1.5 9 9 0 0 1-1.7-2.1c-.2-.3 0-.5.1-.6l.5-.6a2 2 0 0 0 .3-.5.6.6 0 0 0 0-.6l-1-2.3c-.2-.6-.5-.5-.7-.5h-.6a1.2 1.2 0 0 0-.9.4A3.6 3.6 0 0 0 5.6 9c0 1.6 1.1 3.1 1.3 3.3a12.4 12.4 0 0 0 4.8 4.2c.7.3 1.2.5 1.6.6a3.9 3.9 0 0 0 1.8.1 3 3 0 0 0 2-1.4 2.4 2.4 0 0 0 .2-1.4c-.1-.1-.3-.2-.6-.3zM12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3.1.8.8-3-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>
    </span>
    <span class="txt">تواصل معنا على واتساب<small>ردّ سريع خلال دقائق</small></span>
    <span class="arw">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </span>
  </a>

  <div class="foot">
    هوميرا للتسويق العقاري · <span data-tw="contactAddress">حي الفيصلية، جدة، السعودية</span>
  </div>

</main>

<script>
(function () {
  var FALLBACK = '966530425505';
  var MSG = 'مرحباً هوميرا، أرغب بالاستفسار عن مشاريعكم';

  /* الرقم يأتي من إعدادات لوحة التحكم (contactPhone) — ونرجع للرقم الافتراضي
     إن لم تصل الإعدادات أو كان الرقم غير صالح */
  function waNumber() {
    var tweaks = window.__HOMERA_TWEAKS || {};
    var digits = String(tweaks.contactPhone || '').replace(/\D/g, '');
    return digits.length >= 9 ? digits : FALLBACK;
  }

  function syncWaLinks() {
    var url = 'https://wa.me/' + waNumber() + '?text=' + encodeURIComponent(MSG);
    document.querySelectorAll('[data-wa]').forEach(function (a) { a.href = url; });
  }

  syncWaLinks();
  /* homera-tweaks.js يحدّث __HOMERA_TWEAKS بعد جلب الإعدادات من الخادم */
  if (window.HOMERA_API && window.HOMERA_API.bootstrap) {
    window.HOMERA_API.bootstrap().then(syncWaLinks).catch(function () {});
  }
  document.addEventListener('DOMContentLoaded', syncWaLinks);
})();
</script>

</body>
</html>
